        // 獲取真實台股股價
        async function getRealStockPrice(symbol) {
            try {
                const response = await fetch(`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=${new Date().toISOString().slice(0, 7).replace('-', '')}&stockNo=${symbol}&response=json`);
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    const latestData = data.data[data.data.length - 1];
                    return {
                        price: parseFloat(latestData[6]), // 收盤價
                        volume: parseInt(latestData[1].replace(/,/g, '')), // 成交股數
                        date: latestData[0]
                    };
                }
            } catch (error) {
                console.error(`獲取 ${symbol} 股價失敗:`, error);
            }
            return null;
        }

        // 計算動態獲利目標（根據股價和波動性）
        function calculateProfitTarget(price, volatility = 'medium') {
            // 根據股價區間設定不同的獲利目標
            let profitPercent;

            if (price < 10) {
                // 低價股：波動大，設定較高目標
                profitPercent = volatility === 'high' ? 0.15 : 0.12; // 12-15%
            } else if (price < 20) {
                // 中低價股
                profitPercent = volatility === 'high' ? 0.12 : 0.10; // 10-12%
            } else if (price < 30) {
                // 中價股
                profitPercent = volatility === 'high' ? 0.10 : 0.08; // 8-10%
            } else {
                // 高價股：波動小，設定較低目標
                profitPercent = volatility === 'high' ? 0.08 : 0.06; // 6-8%
            }

            return profitPercent;
        }

        // 驗證並修正 AI 推薦的股票價格
        async function validateAndCorrectStocks(stocks) {
            const correctedStocks = [];

            for (const stock of stocks) {
                const realData = await getRealStockPrice(stock.symbol);

                if (realData) {
                    // 使用真實股價
                    const realPrice = realData.price;

                    // 判斷波動性（可以從技術指標或 AI 分析中獲取）
                    const volatility = stock.technicalAnalysis?.volatility || 'medium';

                    // 動態計算獲利目標
                    const profitPercent = calculateProfitTarget(realPrice, volatility);

                    // 計算交易數據
                    const shares = Math.floor(10000 / realPrice);
                    const targetPrice = (realPrice * (1 + profitPercent)).toFixed(2);
                    const stopLoss = (realPrice * 0.98).toFixed(2); // 2% 止損
                    const expectedProfit = ((targetPrice - realPrice) * shares).toFixed(0);
                    const profitPercentDisplay = (profitPercent * 100).toFixed(1) + '%';

                    // 計算風險報酬比
                    const riskRewardRatio = (profitPercent / 0.02).toFixed(2); // 獲利% / 止損%

                    correctedStocks.push({
                        ...stock,
                        currentPrice: realPrice.toFixed(2),
                        entryPrice: realPrice.toFixed(2),
                        targetPrice: targetPrice,
                        stopLoss: stopLoss,
                        shares: shares.toString(),
                        volume: realData.volume.toString(),
                        expectedProfit: expectedProfit,
                        profitPercent: profitPercentDisplay,
                        riskRewardRatio: riskRewardRatio,
                        investment: '10000',
                        dataSource: '台灣證交所即時數據',
                        calculationMethod: `動態獲利目標（${profitPercentDisplay}）基於股價 $${realPrice} 和波動性`
                    });
                } else {
                    // 如果無法獲取真實數據，標記為無效
                    console.warn(`無法獲取 ${stock.symbol} 的真實數據`);
                }
            }

            return correctedStocks;
        }

                const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 2000,
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 錯誤: ${response.status}`);
                }

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;

                console.log('AI 原始回應:', text);

                // 解析 JSON - 更強健的處理
                let jsonMatch = text.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    let jsonStr = jsonMatch[0];

                    // 清理可能的問題
                    // 1. 移除所有註解（單行和多行）
                    jsonStr = jsonStr.replace(/\/\/.*$/gm, '');
                    jsonStr = jsonStr.replace(/\/\*[\s\S]*?\*\//g, '');

                    // 2. 移除多餘的逗號（在 } 或 ] 前面）
                    jsonStr = jsonStr.replace(/,(\s*[}\]])/g, '$1');

                    // 3. 處理字串中的特殊字符
                    // 先保護已經正確的雙引號字串
                    const strings = [];
                    jsonStr = jsonStr.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g, (match) => {
                        strings.push(match);
                        return `__STRING_${strings.length - 1}__`;
                    });

                    // 4. 移除剩餘的單引號
                    jsonStr = jsonStr.replace(/'/g, '');

                    // 5. 還原字串
                    strings.forEach((str, i) => {
                        jsonStr = jsonStr.replace(`__STRING_${i}__`, str);
                    });

                    // 6. 移除控制字符
                    jsonStr = jsonStr.replace(/[\x00-\x1F\x7F]/g, '');

                    console.log('清理後的 JSON:', jsonStr);

                    let stockData;
                    try {
                        stockData = JSON.parse(jsonStr);
                    } catch (parseError) {
                        console.error('JSON 解析錯誤:', parseError);
                        console.error('錯誤位置:', parseError.message);

                        // 嘗試找出錯誤位置
                        const errorMatch = parseError.message.match(/position (\d+)/);
                        if (errorMatch) {
                            const pos = parseInt(errorMatch[1]);
                            console.error('錯誤附近的內容:', jsonStr.substring(Math.max(0, pos - 50), pos + 50));
                        }

                        throw new Error(`JSON 格式錯誤：${parseError.message}。請重新分析。`);
                    }

                    // 顯示市場分析（包含分析時間和交易提醒）
                    if (stockData.marketAnalysis) {
                        displayMarketAnalysis(
                            stockData.marketAnalysis,
                            stockData.analysisTime,
                            stockData.tradingReminder
                        );
                    }

                    // 驗證並修正股票價格（使用真實數據）
                    if (stockData.stocks && stockData.stocks.length > 0) {
                        result.innerHTML = '<p class="text-yellow-400">⏳ 正在驗證股價並獲取即時數據...</p>';
                        result.classList.remove('hidden');

                        const correctedStocks = await validateAndCorrectStocks(stockData.stocks);

                        if (correctedStocks.length > 0) {
                            displayStocks(correctedStocks);
                            result.innerHTML = '<p class="text-green-400">✅ 專業分析完成！所有股價已使用台灣證交所即時數據驗證。</p>';
                        } else {
                            result.innerHTML = '<p class="text-red-400">❌ 無法獲取即時股價數據，請稍後再試。</p>';
                        }
                    }
                } else {
                    throw new Error('無法解析 AI 回應');
                }

            } catch (error) {
                result.innerHTML = `<p class="text-red-400">❌ 錯誤：${error.message}</p>`;
                result.classList.remove('hidden');
                console.error('詳細錯誤:', error);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        });

                        </tbody>
                    </table>
                </div>
            `;

            // 詳細分析卡片
            const stocksHTML = stocks.map((stock, index) => `
                <div class="bg-gradient-to-r from-blue-900 to-purple-900 rounded-lg p-6">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-2xl font-bold">${stock.name} (${stock.symbol})</h3>
                            <p class="text-blue-300">當前價格：$${stock.currentPrice} | 成交量：${stock.volume}</p>
                            ${stock.dataSource ? `<p class="text-green-400 text-sm">✅ ${stock.dataSource}</p>` : ''}
                        </div>
                        <span class="bg-blue-600 px-4 py-2 rounded-full font-bold">
                            推薦 ${index + 1}
                        </span>
                    </div>

                    <!-- 操作理由（專業詳細版）-->
                    <div class="bg-gradient-to-r from-gray-800 to-gray-900 rounded-lg p-5 mb-4 border-l-4 border-yellow-400">
                        <h4 class="font-bold text-yellow-400 mb-3 text-lg flex items-center">
                            <span class="mr-2">💡</span> 專業操作理由分析
                        </h4>
                        <div class="text-gray-300 leading-relaxed space-y-2 text-sm">
                            ${stock.reason.split('【').filter(s => s.trim()).map(section => {
                                const parts = section.split('】');
                                if (parts.length === 2) {
                                    return `<p><span class="font-semibold text-blue-300">【${parts[0]}】</span>${parts[1]}</p>`;
                                }
                                return `<p>${section}</p>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- 基本面分析 -->
                    ${stock.fundamentals ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-green-400 mb-2">📊 基本面數據</h4>
                        <p class="text-sm text-gray-300">${stock.fundamentals}</p>
                    </div>
                    ` : ''}

                    <!-- 價格區間分析 -->
                    ${stock.priceRange ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-yellow-400 mb-2">💰 價格區間分析</h4>
                        <div class="grid grid-cols-3 gap-2 text-sm">
                            <div><span class="text-green-400">便宜價：</span>${stock.priceRange.cheap}</div>
                            <div><span class="text-blue-400">合理價：</span>${stock.priceRange.fair}</div>
                            <div><span class="text-red-400">追高價：</span>${stock.priceRange.expensive}</div>
                        </div>
                    </div>
                    ` : ''}

                    <!-- 技術指標 -->
                    ${stock.technicalAnalysis ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-yellow-400 mb-2">📈 技術指標（小七娜娜指標）</h4>
                        <p class="text-sm text-gray-300">${stock.technicalAnalysis}</p>
                    </div>
                    ` : ''}

                    <!-- K線組合 -->
                    ${stock.candlestickPattern ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-yellow-400 mb-2">📊 K線組合圖</h4>
                        <p class="text-green-400">${stock.candlestickPattern}</p>
                    </div>
                    ` : ''}

                    <!-- 籌碼分析 -->
                    ${stock.chipAnalysis ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-purple-400 mb-2">💎 籌碼分析</h4>
                        <p class="text-sm text-gray-300">${stock.chipAnalysis}</p>
                    </div>
                    ` : ''}

                    <!-- 消息面分析 -->
                    ${stock.newsAnalysis ? `
                    <div class="bg-gray-800 rounded-lg p-4 mb-4">
                        <h4 class="font-semibold text-orange-400 mb-2">📰 消息面分析</h4>
                        <p class="text-gray-300">${stock.newsAnalysis}</p>
                    </div>
                    ` : ''}

                    <!-- 美股和聯準會影響 -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        ${stock.usImpact ? `
                        <div class="bg-gray-800 rounded-lg p-3">
                            <p class="text-sm text-yellow-400 font-semibold mb-1">📊 美股影響</p>
                            <p class="text-sm text-gray-300">${stock.usImpact}</p>
                        </div>
                        ` : ''}

                        ${stock.fedImpact ? `
                        <div class="bg-gray-800 rounded-lg p-3">
                            <p class="text-sm text-yellow-400 font-semibold mb-1">🏦 聯準會影響</p>
                            <p class="text-sm text-gray-300">${stock.fedImpact}</p>
                        </div>
                        ` : ''}
                    </div>

                    <!-- 進出場策略 -->
                    ${stock.entryStrategy || stock.exitStrategy ? `
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        ${stock.entryStrategy ? `
                        <div class="bg-green-900 bg-opacity-30 rounded-lg p-3 border border-green-600">
                            <p class="text-sm text-green-400 font-semibold mb-1">🎯 進場策略</p>
                            <p class="text-sm text-gray-300">${stock.entryStrategy}</p>
                        </div>
                        ` : ''}

                        ${stock.exitStrategy ? `
                        <div class="bg-blue-900 bg-opacity-30 rounded-lg p-3 border border-blue-600">
                            <p class="text-sm text-blue-400 font-semibold mb-1">🚪 出場策略</p>
                            <p class="text-sm text-gray-300">${stock.exitStrategy}</p>
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}

                    <!-- 風險因素 -->
                    ${stock.riskFactors ? `
                    <div class="bg-red-900 bg-opacity-20 rounded-lg p-3 mb-4 border border-red-600">
                        <p class="text-sm text-red-400 font-semibold mb-1">⚠️ 風險因素</p>
                        <p class="text-sm text-gray-300">${stock.riskFactors}</p>
                    </div>
                    ` : ''}

                    <!-- 交易數據 -->
                    <div class="grid grid-cols-4 gap-4">
                        <div class="bg-gray-800 rounded p-3">
                            <p class="text-sm text-gray-400">進場點位</p>
                            <p class="text-lg font-bold text-green-400">$${stock.entryPrice}</p>
                        </div>
                        <div class="bg-gray-800 rounded p-3">
                            <p class="text-sm text-gray-400">出場點位</p>
                            <p class="text-lg font-bold text-blue-400">$${stock.targetPrice}</p>
                        </div>
                        <div class="bg-gray-800 rounded p-3">
                            <p class="text-sm text-gray-400">止損點位</p>
                            <p class="text-lg font-bold text-red-400">$${stock.stopLoss}</p>
                        </div>
                        <div class="bg-gray-800 rounded p-3">
                            <p class="text-sm text-gray-400">預期獲利</p>
                            <p class="text-lg font-bold text-yellow-400">$${stock.expectedProfit}</p>
                        </div>
                    </div>

                    <div class="mt-4 space-y-2">
                        <div class="bg-green-900 rounded-lg p-3">
                            <p class="text-sm text-gray-300">
                                投資金額：$${stock.investment} | 購買股數：${stock.shares}股 | 獲利率：${stock.profitPercent}
                            </p>
                        </div>
                        ${stock.riskRewardRatio ? `
                        <div class="bg-blue-900 rounded-lg p-3">
                            <p class="text-sm text-yellow-400">
                                風險報酬比：1:${stock.riskRewardRatio} （每承擔1元風險，可獲得${stock.riskRewardRatio}元報酬）
                            </p>
                        </div>
                        ` : ''}
                        ${stock.calculationMethod ? `
                        <div class="bg-gray-800 rounded-lg p-3">
                            <p class="text-xs text-gray-400">
                                💡 ${stock.calculationMethod}
                            </p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            stocksDiv.innerHTML += summaryTable + stocksHTML;
        }

        console.log('✅ 系統初始化完成');
    </script>
</body>
</html>
