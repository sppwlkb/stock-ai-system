<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試頁面</title>
    <style>
        body {
            background: #1a202c;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .success {
            color: #48bb78;
        }
        .error {
            color: #f56565;
        }
    </style>
</head>
<body>
    <h1>✅ Vercel 部署測試頁面</h1>
    <p class="success">如果您看到這個頁面，表示 Vercel 部署成功！</p>
    <p>問題可能出在 JavaScript 或環境變數。</p>
    <hr>
    <h2>請檢查：</h2>
    <ol>
        <li>按 F12 打開開發者工具</li>
        <li>切換到 Console 標籤</li>
        <li>查看錯誤訊息</li>
        <li>告訴我看到什麼錯誤</li>
    </ol>
</body>
</html>
